<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>$title</title>
<style>
  @page { size: 595.32pt 841.92pt; margin: 0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #fff; }
  body {
    font-family: "Microsoft YaHei", "微软雅黑", "PingFang SC", Arial, sans-serif;
    color: #121726;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  .page { position: relative; width: 595.32pt; height: 841.92pt; overflow: hidden; background: #fff; }
  .title { position: absolute; left: 34pt; top: 25pt; font-size: 15pt; line-height: 1.25; font-weight: 600; letter-spacing: .1pt; }
  .subtitle { position: absolute; right: 34pt; top: 29pt; font-size: 9.5pt; line-height: 1.2; color: #6b7380; }
  .requirement { position: absolute; left: 34pt; top: 50.5pt; font-size: 8.6pt; line-height: 1.2; color: #6b7380; }
  .label { position: absolute; font-size: 8.6pt; line-height: 1.2; color: #6b7380; }
  .label-1 { left: 34pt; top: 69.6pt; }
  .label-2 { left: 205.74pt; top: 69.6pt; }
  .label-3 { left: 205.74pt; top: 398.9pt; }
  .box { position: absolute; border: .7pt solid #e0e3f0; overflow: hidden; background: #fff; }
  .box-1 { left: 34pt; top: 82pt; width: 161.74pt; height: 351.18pt; }
  .box-2 { left: 205.74pt; top: 82pt; width: 355.58pt; height: 274.70pt; }
  .box-3 { left: 205.74pt; top: 410.70pt; width: 355.58pt; height: 177.57pt; }
  .box img { display: block; width: 100%; height: 100%; }
  .fit-cover img { object-fit: cover; }
  .fit-contain { background: #f7f8fa; }
  .fit-contain img { object-fit: contain; }
  .placeholder { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; padding: 10pt; text-align: center; font-size: 8.6pt; line-height: 1.6; color: #98a0ad; background: #fafbfd; border: .8pt dashed #cfd5e2; }
  .footer { position: absolute; left: 34pt; right: 34pt; top: 822pt; font-size: 8.2pt; line-height: 1.2; color: #8c94a1; }
</style>
</head>
<body>
<div class="page">
  <div class="title">$title</div>
  <div class="subtitle">$subtitle</div>
  <div class="requirement">$requirement</div>
  $labels
  $boxes
  <div class="footer">$footer</div>
</div>
</body>
</html>
